name: lagscope-ci

services:
  jenkins:
    build: .
    image: lagscope-jenkins:local
    container_name: lagscope-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Xmx768m"
      CASC_JENKINS_CONFIG: /usr/share/jenkins/casc.yaml
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Run prepare.ps1 or prepare.sh first}
      DOCKER_HOST: tcp://minikube:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /minikube/certs
      KUBECONFIG: /minikube/kubeconfig
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./secrets:/minikube:ro
    networks:
      - minikube

volumes:
  jenkins_home:

networks:
  minikube:
    external: true
