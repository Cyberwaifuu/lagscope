[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lagscope"
version = "0.1.0"
description = "Lag and strength of influence between daily sentiment series (government channels, bloggers, mass audience)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Abenova Sabina" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.15",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
app = ["streamlit>=1.56"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1.2"]

[tool.setuptools]
packages = ["lagscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["lagscope"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR2004", "PLR0913", "PLR0912"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0911"]
