apiVersion: v1
kind: Namespace
metadata:
  name: lagscope
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lagscope
  namespace: lagscope
  labels:
    app: lagscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lagscope
  template:
    metadata:
      labels:
        app: lagscope
    spec:
      containers:
        - name: lagscope
          image: lagscope:IMAGE_TAG
          imagePullPolicy: Never
          ports:
            - containerPort: 8501
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: lagscope
  namespace: lagscope
spec:
  type: NodePort
  selector:
    app: lagscope
  ports:
    - port: 8501
      targetPort: 8501
      nodePort: 30851
